[[rules]]
id = "SAF-008"
name = "TransientViewStorageNonAuthoritative"
invariant = "Transient epoch-view storage is never authority: it never survives as a source for following, forging, recovery or activation, nothing in it reaches a core output except through the deterministic derivation it feeds, and a crash at any point leaves the durable chain, write-ahead log and checkpoint unchanged and the next replay identical. Startup purges it before normal operation: it deletes only entries inside the transient store's own directory whose names have the deterministic window-key form, makes the deletion durable by syncing the parent directory, continues only when the directory is empty, and halts on an entry it does not recognize or cannot delete."
