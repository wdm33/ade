[[rules]]
id = "SEC-006"
name = "ClosedKeyEnvelopes"
invariant = "Signing keys and operational certificates load only through closed parsers, each a deterministic function of the file's bytes, accepting exactly three grammars: the Ade KES envelope ade.kes.seed.v1 (fields format, role, crypto, seed_32, period_idx and format_version, each validated, plus the ignored metadata fields genesis_hash, network_magic, created_at_slot and created_by, and no other field); the cardano-cli text envelope of type KesSigningKey_ed25519_kes_2^6 whose cborHex is a CBOR byte string of exactly 608 bytes, a Sum6 KES signing key whose every subtree's verification-key hashes are consistent and whose leaves are not all zero; and the cardano-cli text envelope of type NodeOperationalCertificate whose cborHex is the CBOR array [[32-byte hot key, unsigned-integer sequence number, unsigned-integer KES period, 64-byte signature], 32-byte cold key]. Any other shape, role, crypto tag, version, size, arity or field type is rejected with a structured error and no fallback, and no private-key byte appears in any error, log or telemetry output."
counterexample = "A KES envelope with an unknown field loads by ignoring the field, a 612-byte key file loads by truncation, a key whose subtree verification keys disagree loads, or a parse error message includes the seed bytes."
family = "SEC"
secondary_families = ["VAL"]
scope = "RED key and certificate loading"
assumptions = ["A2", "A3"]
depends_on = ["SEC-001"]
locality = "local"
criticality = "critical"
enforcement_compile_time = []
enforcement_runtime = ["crates/ade_runtime/src/producer/ade_kes_envelope.rs — parse, serialize, AdeKesEnvelopeError; carried from legacy DC-CRYPTO-06", "crates/ade_runtime/src/producer/keys.rs — load_ade_kes_signing_key, write_ade_kes_envelope, KeyLoadError::AdeEnvelope; carried from legacy DC-CRYPTO-06", "crates/ade_runtime/src/producer/keys.rs — load_kes_signing_key_skey routes 608-byte payloads through ade_crypto::kes_sum::Sum6Kes::raw_deserialize_signing_key_kes; wrong-size payloads return UnsupportedExpandedKesKeyFormat; carried from legacy DC-CRYPTO-07", "crates/ade_runtime/src/producer/keys.rs — load_*_signing_key_skey, load_ade_kes_signing_key, write_ade_kes_envelope, KeyLoadError; carried from legacy OP-OPS-04", "crates/ade_runtime/src/producer/ade_kes_envelope.rs — closed envelope grammar; carried from legacy OP-OPS-04", "crates/ade_runtime/src/producer/signing.rs — RED-confined custody, KesSecret with BLUE-owned inner; carried from legacy OP-OPS-04", "crates/ade_crypto/src/kes_sum — carried from legacy OP-OPS-04", "crates/ade_node/src/key_gen.rs — one-shot key-gen-KES surface; carried from legacy OP-OPS-04", "crates/ade_runtime/src/producer/producer_shell.rs — ProducerShell::init: opcert-window check on the INJECTED current absolute period + anchor evolution-0 at opcert_start + kes_update to current-opcert_start; KesEvolutionFailed; carried from legacy OP-OPS-04", "crates/ade_node/src/operator_forge.rs — build_operator_forge_material derives the current period from the injected current_slot + genesis KES anchor; carried from legacy OP-OPS-04", "crates/ade_node/src/node_lifecycle.rs — injects the recovered durable tip slot as the forge KES anchor; carried from legacy OP-OPS-04", "crates/ade_runtime/src/producer/opcert_envelope.rs — parse_opcert_envelope + closed OpCertParseError enum; carried from legacy CN-OPCERT-01", "crates/ade_runtime/src/producer/opcert_envelope.rs — parser_is_byte_identical_across_two_runs unit test; carried from legacy DC-OPCERT-01"