[[rules]]
id = "SAF-022"
name = "ParticipantForgeOnSelectedHead"
invariant = "In a declared participant venue, forging first passes SAF-013's catch-up gate; from the first instant the durable servable tip equals the followed peer tip, it enters a participant extension whose forge base at each decision is the live selected durable tip. A decision in the extension refuses with a typed reason when the venue is not declared participant, when any fork-choice decision is pending (a reselection, a fork switch or a missing bridge; SAF-014), or when no durable servable tip exists, and it never gates on the tip of Ade's own last forge. Immediately before signing, the durable tip is read again and the forge is refused if it differs from the decision's base. The decision is a pure total function over closed types that never invokes chain selection and holds no signing material; the extension is not persisted, a restart entering it again only through the catch-up gate."
counterexample = "The participant decision re-checks that the durable tip still equals Ade's own last forged block, so once a peer's block is admitted it refuses every later slot; or a peer block admitted between decision and signing leaves the forge signing on the old tip."
family = "SAF"
secondary_families = ["LIV"]
scope = "node mode, participant venue forge decision"
assumptions = ["A1"]
depends_on = ["SAF-013", "SAF-014", "VAL-031", "STR-015"]
locality = "local"
criticality = "critical"
enforcement_compile_time = []
