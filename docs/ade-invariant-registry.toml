[[rules]]
id = "VAL-024"
name = "LeadershipFromSealedView"
invariant = "The stake distribution used for a leader check in epoch E comes only from the sealed frozen leadership object whose target epoch is exactly E, read after its protocol-parameter commitment is verified; it is never re-derived at use time, never taken from a latest or nearest object, and never replaced by window replay or the bootstrap view, and a missing, unsealed or malformed object fails closed. Its sigma denominator is the snapshot's total active stake, computed once from the snapshot's credential-side stake before any pool-membership filtering, by one definition shared by native sealing and bootstrap seeding, and included in the object's canonical encoding and hash; it is never computed by summing the object's pool entries, at sealing or at reading, and a missing total fails closed."
counterexample = "Leadership computes the denominator by summing the listed pools, so a positive-stake pool filtered out of the list shrinks the denominator and raises every other pool's leader probability; or a missing object for epoch E is answered with the object for E-1."
