[[rules]]
id = "DUR-013"
name = "AdmissionAppendsExactlyOnce"
invariant = "Every successful admission, received or self-forged, appends exactly one block-admission entry to the write-ahead log, chained from the folded fingerprint (DUR-009), and no admission entry exists without its admission or for a block already admitted on the selected prefix; an append that fails halts the node with the tip unadvanced (SAF-019)."
counterexample = "A retried admission appends a second entry for the same block, both carrying a prior fingerprint the fold accepts, so recovery replays the block twice."
