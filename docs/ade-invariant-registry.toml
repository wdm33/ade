[[rules]]
id = "SAF-021"
name = "ForgeEpochBoundToActiveAuthority"
invariant = "A forge for a slot in epoch E uses only the active epoch authority's view for exactly E (its stake distribution and epoch nonce); the authority is consulted before any leader check or signing. If the authority holds an earlier epoch than E and the node is a producer whose support ends at its seed epoch, the slot is a typed no-forge and the node keeps following; if the authority is ahead of E, or E's promotion is missing where continuity is required, the forge halts with a typed terminal error. A block is never signed for epoch E with another epoch's nonce or stake distribution."
counterexample = "After an epoch boundary the forge keeps using the seed epoch's nonce, signs a block for the new epoch, and peers reject it."
