[[rules]]
id = "ORD-001"
name = "NoRetroactiveValidation"
invariant = "The verdict on a block or transaction depends only on the chain prefix before it and on context fixed by that prefix or recorded before its validation, such as the slot it claims; no data first derived after that point (a later block, a later epoch's stake distribution or nonce, a later checkpoint) changes its verdict, and an adopted checkpoint is never reinterpreted under a different rule version."
counterexample = "A header's VRF leader check uses the epoch nonce of the epoch after the header's own, a value that exists only once that later epoch's stability window has passed; or a stored checkpoint is reloaded under a newer rule version and its blocks are judged again with a different verdict."
