[[rules]]
id = "DUR-001"
name = "ActivationDurableBeforeVisible"
invariant = "An epoch view becomes the active view only after its activation record is durable, through one ordered path: take the candidate (for an epoch past the second bootstrap epoch, the sealed leadership object for exactly that epoch with its stored provenance; for the two bootstrap epochs, the certified bootstrap seeding), check the activation predicate (the transition is due and the candidate's bindings match the selected chain), write the activation record durably, then publish; recovery restores exactly the durably recorded activation, rebuilding the view and requiring it to reproduce the record, and with no record the previous view stays active."
