[[rules]]
id = "VAL-029"
name = "SeedBoundaryRewardAuthority"
invariant = "The reward update applied at the first boundary after bootstrap has exactly one source, chosen by the certified snapshot's reward-update state and recorded as a closed sum inside the durable record's commitment, so an absent update is never represented as a zero-valued one: a completed update is applied once, reducing the fee pot by its fee value; when no update was started, the ordinary reward calculation runs from the snapshot's inputs, the same function every later boundary uses, and the imported fee pot is reduced by the snapshot's fee value before rotation; a snapshot taken while the update was still being computed is refused. A native calculation that yields a zero pool pot while the previous epoch's block counts are non-empty is terminal, and no imported reward delta is applied except from a completed imported update."
counterexample = "The bootstrap boundary applies the snapshot's completed reward update but not its fee-pot reduction, so the fee pot frozen at the next snapshot is too large; or a snapshot taken mid-calculation is accepted and its partial update applied."
family = "VAL"
secondary_families = ["CON"]
scope = "first post-bootstrap epoch boundary"
assumptions = ["A2"]
depends_on = ["VAL-020"]
locality = "transactional"
