[[rules]]
id = "DET-013"
name = "ReducedCheckpointMirrorsLedger"
invariant = "The reduced UTxO checkpoint is a projection of the ledger's own UTxO application: each block's delta removes exactly the inputs and adds exactly the outputs the ledger's application would, under the same keys, each reduced to its coin and stake reference; its certificate, delegation and governance state advance in block order through the ledger's own certificate processing, starting from the bootstrap certificate state; any step failure aborts the window without producing a result, and a partially applied window leaves the checkpoint marked incomplete, never producing a stake snapshot from partial data; the checkpoint can be rebuilt from the blocks by replay."
counterexample = "The checkpoint's delta is computed by a separate parser that misses collateral returns, so the reduced stake drifts from the ledger's; or a crash mid-window leaves a checkpoint that is read as complete."
family = "DET"
secondary_families = ["REC"]
scope = "reduced UTxO checkpoint"
assumptions = ["A1"]
depends_on = ["VAL-037", "REC-002", "VAL-016"]
locality = "transactional"
criticality = "critical"
enforcement_compile_time = []
