[[rules]]
id = "DET-002"
name = "DesignatedByteAuthority"
invariant = "Each authoritative hash, signature check and persisted or transmitted byte string uses its designated byte authority: protocol hashes and signatures (block header, block body, transaction ID, script and datum hashes) are computed over the bytes as they were received or produced on the wire, never over a re-encoding of decoded data; Ade's own commitments (state fingerprints and persisted records) are computed over the output of the single canonical encoder for that type."
counterexample = "A block-body hash computed over a re-encoding of the decoded body, for a body whose producer used an indefinite-length array, so the hash differs from the one in the signed header and a valid block is rejected; or a state fingerprint computed over two different encodings of the same state."
