[[rules]]
id = "VAL-001"
name = "ClosedGrammarDecoding"
invariant = "Each authoritative wire or ledger type has exactly one decoder per protocol version, and it accepts exactly the closed grammar the reference node accepts for that type and version, including valid non-canonical CBOR; each of Ade's own storage record types (write-ahead log, chain database, snapshots) has exactly one decoder per format version, accepting exactly the closed grammar Ade defines for that version. Bytes outside the applicable grammar are rejected with a deterministic structured error before any authoritative state transition, and no fallback, legacy or lenient parser accepts bytes the decoder rejects, on any code path. Where a wire or ledger type's grammar and meaning are unchanged between two supported protocol versions, both versions' decoders give the same result for the same bytes, and every difference between protocol versions is one the reference node also makes; differences between Ade storage format versions are exactly those Ade's format definitions declare."
counterexample = "A delegation certificate with an extra trailing field that the decoder rejects but a fallback parser on the recovery path accepts; or a transaction body map with a duplicated key, which the reference node rejects, that Ade decodes and validates."
family = "VAL"
secondary_families = []
scope = "codec: every authoritative wire and ledger type, and every Ade storage record type"
assumptions = ["A2"]
depends_on = ["DET-003", "SEC-002"]
locality = "local"
