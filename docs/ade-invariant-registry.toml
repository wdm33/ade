name = "SingleProducerForgeBase"
invariant = "In a declared single-producer venue the forge base becomes the node's own selected durable tip only through an established extension: entered by catching up and then self-admitting an own block through the admission path, or, at warm start, by a successful recovery whose durable tip lies above the bootstrap anchor and proves own-forged continuation, and held only while no competing block has been observed on the peer receive stream since catch-up or self-admission, the relay does not produce blocks, the durable chain is contiguous and servable, and no fork-choice decision is required. A failed warm-start entry falls back to #11's catch-up gate; an established extension that loses a fence (a competing block is observed, or the relay produces) refuses to forge, never falling back to the catch-up gate. In the established extension, a clean structural end of the follow feed does not stop forging, while a shutdown request or a fatal feed failure does. A file-based adoption certificate is evidence only, never forge-base authority, and appears in no multi-producer, preprod or production forge path."
counterexample = "A single-producer node keeps waiting for a relay to echo its own block before forging the next one, or an operator certificate file decides which tip the node forges on."
