[[rules]]
id = "SAF-024"
name = "AdmissionDivergenceHalts"
invariant = "In admission mode a block whose slot lies outside the consensus inputs' epoch window, and undecodable peer bytes, are stopped before block validity is called; they, and a diverged or input-not-found verdict derived from admission evaluation, each halt the run with a distinct non-zero exit code and a typed halt event; undecodable bytes are classified as diverged (when the peer has a tip at that slot) or as a typed undecodable-bytes halt, never as input not found and never as a clean exit. The reducer stays pure; the halt is the binary's response."
counterexample = "The runner logs an undecodable block and exits 0, so an adversarial peer makes a failed run look clean."
family = "SAF"
