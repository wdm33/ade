[[rules]]
id = "DUR-011"
name = "CollateralValueRetained"
invariant = "When a block's phase-2-invalid transaction spends a collateral input, the UTxO authority durably records that input's coin value in the same durable transaction that applies the block's changes to the live table and advances the checkpoint cursor, so the accumulator can resolve it at any later cursor position; retention covers exactly the bindings destroyed since bootstrap, is cleared with the live table when the store resets, and lies outside the checkpoint commitment; an input that neither the block nor the authority holds resolves to nothing, and the accumulator refuses, naming the input."
counterexample = "The checkpoint deletes a spent collateral input before the accumulator, one block behind, resolves it, and the accumulator counts its value as zero."
family = "DUR"
secondary_families = ["CON"]
scope = "reduced UTxO checkpoint, collateral resolution"
assumptions = ["A6"]
depends_on = ["CON-003", "DET-013"]
locality = "transactional"
criticality = "critical"
