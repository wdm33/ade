[[rules]]
id = "CON-001"
name = "ValueConservation"
invariant = "Every accepted ledger transition preserves value as the Conway ledger defines it. For a transaction applied with its scripts valid, consumed value (inputs, withdrawals, deposit refunds, minted value) equals produced value (outputs, fee, new deposits, treasury donation, burned value); for a transaction applied with its scripts invalid, only its collateral inputs are consumed, and they equal the collateral return plus the collateral collected as fee. Reserves, treasury, reward accounts, deposits and the fee pot change only through the protocol rules that authorize those movements."
counterexample = "A script-valid transaction whose produced value (outputs, fee, new deposits, treasury donation, burned value) exceeds its consumed value (inputs, withdrawals, deposit refunds, minted value) by one lovelace is accepted, a script-invalid transaction whose collateral return exceeds its collateral inputs is accepted, or an epoch transition moves funds into the treasury without a rule authorizing it."
family = "CON"
secondary_families = ["VAL"]
scope = "ledger (transactions and epoch transitions)"
assumptions = ["A2"]
depends_on = ["SAF-001"]
locality = "transactional"
criticality = "critical"
