invariant = "The era schedule's forecast horizon extends past an epoch boundary if and only if the next epoch's view has been durably promoted, and the extension is part of the same transition as the promotion; a header at a slot beyond the horizon is rejected as out of forecast range before any leader view is read. The extended schedule is derived state: it is computed from the durable activation record, the recovered promoted view and the committed network geometry and profile, never persisted as a separate authority, and recovery reconstructs a schedule identical to the one before the restart, whether or not the promotion had happened; no flag, clock or peer input affects it."
