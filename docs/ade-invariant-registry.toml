[[rules]]
id = "DET-015"
name = "SnapshotHeaderChecks"
invariant = "A snapshot's version tag is read and checked before any of its payload is decoded, and its fingerprint is blake2b-256 of the decoded state's canonical encoding, recomputed after decoding and compared with the stored one."
