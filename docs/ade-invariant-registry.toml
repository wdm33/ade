[[rules]]
id = "CON-003"
name = "CollateralFromResolvedInputs"
invariant = "The ADA a phase-2-invalid transaction consumes equals the sum of its resolved collateral inputs' values minus its collateral return; an unresolved collateral input is a typed refusal, never zero or a skipped contribution, and the declared total-collateral field is never used as the value. The accumulator receives these values from the UTxO authority through a resolver; it neither owns nor rebuilds a UTxO."
counterexample = "A collateral input missing from the reduced UTxO is counted as zero, so the fee pot is credited too little; or the total-collateral field is used in place of the resolved inputs."
family = "CON"
secondary_families = ["VAL"]
scope = "collateral accounting"
assumptions = ["A2"]
depends_on = ["CON-001"]
locality = "local"
criticality = "critical"
