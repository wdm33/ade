# Invariant registry — Ade
#
# The canonical, append-only list of defined invariants (Doctrine §4).
# An entry is appended only when the human approves its line in a Define batch
# (Doctrine §32); its ID is assigned at that moment (Doctrine §7).
#
# What agents may append, and how: ~/.claude/methodology/idse.md §3 step 4.
# Every other field changes only by redefinition
# (Doctrine §5): agent draft, consensus, human approval, recorded in
# `redefinitions` with the text it replaced (idse.md §1.4).
# Assumptions are recorded once, below, and entries cite them by ID.
#
# Families, ID and name patterns: Doctrine §6–§7.
# Checked by: python3 -I ~/.claude/methodology/tools/idse-id-lint.py
#
# Legacy IDD entries are frozen in docs/legacy/idd-invariant-registry.toml.
# Each entry migrated from one carries `legacy_ids`; every legacy ID's
# disposition is in docs/legacy/idd-to-idse-map.toml.

schema_version = 3
project = "ADE"
registry_count = 260

[[assumptions]]
id = "A1"
name = "ordered-recorded-inputs"
text = "for each authoritative state machine (ledger, chain selection, and each mini-protocol's state), the shell delivers inputs one at a time in one total order, and records the starting state, that order and each input's explicit context, so the history can be replayed completely."
approval = { by = "wdm33", date = "2026-11-08", record = "docs/planning/foundations.define.consensus.md#batch-1" }
redefinitions = []
status = "active"

[[assumptions]]
id = "A2"
name = "reference-node-semantics"
text = "the Haskell cardano-node defines the reference semantics for every observable protocol behaviour Ade claims to match; each comparison names the exact reference build it uses (the live venue runs 11.0.1; the pinned ledger-state hash corpus was extracted from 10.6.2). Ade executes only Conway semantics: it enters at a certified non-Origin Conway tip and never replays or executes historical eras, keeping historical era facts only as identifiers and slot-time geometry."
approval = { by = "wdm33", date = "2026-11-08", record = "docs/planning/foundations.define.consensus.md#batch-1" }
redefinitions = []
status = "active"

[[assumptions]]
id = "A3"
name = "nonzero-derived-kes-seeds"
text = "a KES sub-seed derived by the Sum6 seed expansion is never all zero (probability 2^-256), so a zeroed sub-seed in a stored key marks a period that has been evolved away."
approval = { by = "wdm33", date = "2026-11-08", record = "docs/planning/codec-wire-crypto.define.consensus.md#batch-1" }
redefinitions = []
status = "active"

[[assumptions]]
id = "A4"
name = "rollback-depth-bound-k"
text = "the node never adopts a chain that requires rolling back more than k blocks, where k is the consensus security parameter the network's genesis defines under the reference semantics of A2; blocks more than k below the selected tip are immutable."
approval = { by = "wdm33", date = "2026-11-08", record = "docs/planning/epoch.define.consensus.md#batch-1" }
redefinitions = []
status = "active"

[[assumptions]]
id = "A5"
name = "honest-peer-delivery"
text = "after a network partition heals, the node stays connected to at least one peer that offers the chain the network is converging on, and messages from that peer are delivered and processed within a bounded time."
approval = { by = "wdm33", date = "2026-11-08", record = "docs/planning/consensus.define.consensus.md#batch-1" }
redefinitions = []
status = "active"

[[assumptions]]
id = "A6"
name = "durable-commit-honoured"
text = "a write that the storage layer reports as durably committed (a completed fsync or committed database transaction) survives process termination and power loss intact; writes not yet reported committed may be lost."
approval = { by = "wdm33", date = "2026-11-08", record = "docs/planning/durability-recovery.define.consensus.md#batch-1" }
redefinitions = []
status = "active"

[[assumptions]]
id = "A7"
name = "mithril-snapshot-trust"
text = "a Mithril cardano-database snapshot whose immutable files the Mithril client verifies against a certificate chain rooted in the network's published Mithril genesis verification key, and whose ancillary files (the ledger state and UTxO tables) verify under the network's published ancillary verification key, holds the reference node's ledger state at the chain point that state records. Ade does not verify the Mithril multisignature itself: the Mithril client, run outside Ade's core, does."
approval = { by = "wdm33", date = "2026-11-09", record = "docs/planning/mithril-evidence.define.consensus.md#batch-1" }
redefinitions = []
status = "active"

