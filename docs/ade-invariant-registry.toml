[[rules]]
id = "VAL-023"
name = "LeadershipSealedAtBoundaryPoint"
invariant = "At each epoch boundary from E to E+1 that the node crosses itself, the leadership stake distribution for epoch E+2 is sealed as a frozen leadership object in the same durable commit as the accumulator advance, and no boundary advance commits without it: its pool set is the registered pools with at least one delegator in the delegation map before pool reaping, its stake comes from the stake mark captured from the reduced checkpoint positioned exactly at the closing epoch's last durable block (bound to that point and its lineage before use), and its VRF keys come from the pool parameters frozen before reaping. The two epochs no crossing produces, the bootstrap epoch and the one after it, are sealed instead from the certified snapshot's pool distribution and its imported mark snapshot, bound to the certified bootstrap point."
counterexample = "The stake mark is read from the checkpoint after it has advanced past the boundary into the next epoch; or a retired pool that still has delegators is left out of the sealed set because its VRF key was looked up in the active pool parameters at sealing time."
family = "VAL"
secondary_families = ["ORD"]
