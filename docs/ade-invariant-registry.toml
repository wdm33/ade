[[rules]]
id = "VAL-022"
name = "PraosNonceEvolution"
invariant = "Each validated header drives one indivisible nonce transition as the reference Praos protocol defines it: the evolving nonce becomes the evolving nonce combined with the header's VRF nonce output; the candidate nonce becomes the new evolving nonce while the header's slot is below firstSlotNextEpoch minus ceil(4k/f), and otherwise stays frozen; the last-block nonce becomes the hash of the header's previous block. At each epoch tick the epoch nonce becomes the candidate nonce combined with the last-epoch-block nonce, the previous epoch nonce becomes the old epoch nonce, the last-epoch-block nonce becomes the last-block nonce, and the evolving and candidate nonces carry over unchanged. Combining is blake2b-256 of the concatenation, with the neutral nonce as identity and no extra-entropy operand; an absent last-epoch-block nonce fails closed unless a valid bootstrap bridge supplies it, and no nonce is ever fabricated. The first epoch nonce after bootstrap comes from that same tick over the live chain state; a seed-time nonce stored at bootstrap must equal it when the seed sat at or after the freeze slot and is not used otherwise, and a seed position that cannot be located relative to the freeze, or a network whose stability window is unknown, is terminal."
counterexample = "The candidate nonce keeps evolving after the stability-window slot, or the epoch nonce after bootstrap is copied from a value projected at snapshot time while the candidate was still moving, so the node's leader checks use a nonce the network does not."
family = "VAL"
secondary_families = ["DET"]
scope = "Praos chain-dependent nonce state"
assumptions = ["A2"]
depends_on = ["SEC-004"]
locality = "local"
criticality = "critical"
enforcement_compile_time = []
enforcement_runtime = ["crates/ade_core/src/consensus/nonce.rs — carried from legacy DC-EPOCH-16", "crates/ade_core/src/consensus/praos_state.rs — carried from legacy DC-EPOCH-16", "crates/ade_ledger/src/snapshot/chain_dep.rs — carried from legacy DC-EPOCH-16", "crates/ade_core/src/consensus/header_validate.rs — carried from legacy DC-EPOCH-16", "crates/ade_node/src/node_sync.rs — carried from legacy DC-EPOCH-16", "crates/ade_core/src/consensus/era_schedule.rs — carried from legacy DC-EPOCH-16", "crates/ade_runtime/src/consensus/genesis_parser.rs — carried from legacy DC-EPOCH-16", "crates/ade_node/src/bootstrap_export.rs — NetworkProfile.security_param; carried from legacy DC-EPOCH-16", "crates/ade_ledger/src/ledgerdb_state.rs — carried from legacy DC-EPOCH-16", "ci/ci_check_praos_nonce_follow_evolution.sh — carried from legacy DC-EPOCH-16", "crates/ade_ledger/src/seed_consensus_inputs.rs — carried from legacy DC-EPOCH-16", "crates/ade_node/src/node_lifecycle.rs — carried from legacy DC-EPOCH-16", "ci/build_consensus_inputs_bundle.sh — carried from legacy DC-EPOCH-16", "crates/ade_runtime/src/consensus_inputs/importer.rs — carried from legacy DC-EPOCH-16", "crates/ade_ledger/src/bootstrap_bridge.rs — BridgeEta0Finality + bridge_eta0_finality -- the pure decision; seed_time_eta0, named so it cannot be read as authority; carried from legacy DC-EPOCH-38", "crates/ade_node/src/epoch_wire.rs — bridge_eta0_finality_at_seed -- the sole seed-position derivation, read from the SAME era geometry as header_validate's freeze_boundary; bind_bridge_view -- the sole binder, …; carried from legacy DC-EPOCH-38", "crates/ade_node/src/native_firstrun.rs — records the decision at bootstrap; no longer refuses a pre-freeze seed; carried from legacy DC-EPOCH-38"]
