[[rules]]
id = "REC-002"
name = "SingleAdmissionPrefix"
invariant = "The write-ahead log's tail defines the durable selected-chain prefix: the chain database, the Praos chain-dependent state, the epoch accumulator and the reduced UTxO checkpoint are each derived from that one prefix, in chain order, each advancing only after the block is durably admitted, and recovery drops anything above the tail and re-derives any of them that lags or leads it, never resuming with them on different prefixes. The reduced checkpoint is a deterministic projection of the ledger UTxO, so the same blocks give a byte-identical checkpoint, and a missing, corrupt or lagging checkpoint blocks epoch-view production and fails closed."
counterexample = "After a crash the accumulator has applied block 1001 while the WAL tail is block 1000, and the node resumes with the accumulator one block ahead of the chain-dependent state."
family = "REC"
secondary_families = ["DUR"]
scope = "block admission, recovery"
assumptions = ["A1"]
depends_on = ["SAF-001", "DET-001"]
locality = "transactional"
criticality = "critical"
