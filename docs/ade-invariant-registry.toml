[[rules]]
id = "DET-017"
name = "ServerSessionDeterministic"
invariant = "The serving side's per-session reducer is a pure function of the negotiated version, the peer's message sequence, the sequence of newly served blocks and the recorded session events, so the same inputs give byte-identical outbound frames. In each state where the server holds agency it returns a reply legal for that state as the reference protocol defines it (IntersectFound or IntersectNotFound after FindIntersect; RollForward, RollBackward or AwaitReply after RequestNext; StartBatch with blocks or NoBlocks after RequestRange) or a structured close; after AwaitReply it waits only until a recorded served-chain or session event makes a RollForward or RollBackward possible, never in an undefined state."
