[[rules]]
id = "DET-018"
name = "SessionReplayEquivalence"
invariant = "Two guarantees hold for the session layer. Replay: given the same starting state, negotiated version, inbound byte chunks and recorded timestamps, it produces byte-identical outbound frames and an identical sequence of delivered messages. Fragmentation: any two chunkings of the same inbound byte stream produce the same sequence of delivered messages. Each delivery is exactly one complete CBOR item of one mini-protocol, never one mux frame; incomplete trailing bytes are kept until complete, in a reassembly buffer per mini-protocol indexed by the closed set of accepted mini-protocols, so its membership, lookup and iteration are deterministic; malformed CBOR at an item boundary is a structured error, never dropped or partly accepted; order within each peer and mini-protocol is preserved; and the session layer reads no clock, timestamps entering only as values the caller supplies."
counterexample = "A block-fetch message split across two mux frames is delivered as two partial messages, or keep-alive timing inside the session reducer reads the system clock."
family = "DET"
secondary_families = ["ORD"]
scope = "session layer"
assumptions = ["A1"]
depends_on = ["STR-002", "STR-012"]
locality = "local"
criticality = "critical"
