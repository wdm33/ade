name = "PumpOrderPreservedUnderBackpressure"
invariant = "Backpressure may delay a peer's events but never reorder them: the events the pump delivers are the same sequence it would deliver unstalled, frames decoded while parked join the same single FIFO as the rest of their chunk, and one frame is dispatched per loop iteration. Frames held while parked are bounded by a fixed, non-configurable constant, exceeding which fails that peer closed with a typed error; the bound holds because the pump issues no new chain-sync or block-fetch request while parked."
