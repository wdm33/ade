[[rules]]
id = "DUR-010"
name = "BlockBytesBeforeWal"
invariant = "An admitted block's original bytes are durably stored in the chain database before its write-ahead-log entry is appended, on every admission path; a storage failure halts before the append, and at recovery a log entry whose block bytes are missing halts with a typed error, while stored bytes with no log entry are dropped as an orphan."
counterexample = "The log records a block whose bytes never reached disk, and recovery skips the missing block silently, replaying a shorter chain than the log claims."
family = "DUR"
secondary_families = ["REC"]
scope = "block admission, recovery"
assumptions = ["A6"]
depends_on = ["DUR-009", "REC-002"]
locality = "transactional"
criticality = "critical"
