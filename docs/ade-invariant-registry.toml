[[rules]]
id = "DUR-009"
name = "WalFingerprintChain"
invariant = "The write-ahead log's fingerprint chain is checked by folding the log from the bootstrap anchor's initial ledger fingerprint: a block-admission entry, received or self-forged, must record a prior fingerprint equal to the folded value, binds the exact admitted block bytes, and advances the folded value to its post fingerprint; a rollback entry whose target is the bootstrap anchor resets the folded value to the anchor's initial ledger fingerprint, and one whose target is an admission on the currently selected prefix sets it to that admission's post fingerprint, any other target being rejected; provenance and activation entries leave it unchanged. An entry that would break the chain is rejected and halts the node, and verifying the chain at startup is fatal on failure."
