[[rules]]
id = "SEC-011"
name = "OpCertCounterRule"
invariant = "A header is valid only under the reference OCERT rule: its pool's current issue number is the one recorded in the chain-dependent state, or 0 when none is recorded and the pool is in the epoch's stake distribution, and a header from a pool with neither is invalid; the header's operational-certificate issue number must be at least the current one and at most one more than it, otherwise the header is invalid with a typed reason. Counters are keyed by pool; a forward header transition never lowers a pool's recorded number, and a rollback or verified snapshot restore sets the counters to those of the restored point."
counterexample = "A header using an old operational certificate whose issue number is below the pool's recorded one is accepted, letting the holder of a stolen, superseded hot key forge for the pool; or a header whose issue number jumps by two is accepted."
