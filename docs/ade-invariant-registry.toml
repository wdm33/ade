[[rules]]
id = "SAF-013"
name = "ForgeAdmissibilityGatesOnly"
invariant = "Every forge is admissible only when the durable servable tip equals the followed peer tip in hash and block number, except under VAL-053's fenced extension in a single-producer venue and under SAF-022's participant extension in a participant venue; the recovered anchor is never a forge base. The followed-peer-tip signal holds two pieces of evidence separately: the peer's advertised tip, and the tip it served that Ade durably admitted, written only after a successful admission from that admission's own validated tip and cleared by any rollback. The combined view prefers the served tip only when strictly higher, a tie with differing hashes falling to the advertisement; possession questions (the forge gate and the fork-switch fence) read the combined view, and convergence evidence reads the advertisement. The signal can only prevent a forge (a refusal for not being caught up is a typed refusal with no state change), never selects, replaces or reorders chains, and never changes durable state."
counterexample = "A stale advertised peer tip is fed into chain selection and makes the node prefer a shorter chain, or a refused forge still advances the slot cursor."
