[[rules]]
id = "REC-004"
name = "CrashRecoveryReplayEquivalent"
invariant = "All authoritative state is derivable by replay from the bootstrap anchor and the accepted canonical inputs. Two continuous runs from the same recovered or bootstrapped state, with the same ordered block feed, the same clock-tick schedule, the same leadership and key inputs and the same shutdown schedule, produce byte-identical durable outputs (selected tip, ledger fingerprint, write-ahead-log image, checkpoints and halt state), self-forged admissions included. After any process termination or power loss, recovery reaches exactly the last durably committed prefix, and its durable outputs are byte-identical to those of a run that stopped cleanly at that prefix; the ledger fingerprint replay reaches after log entry N equals the fingerprint the log's fold expects after entry N (#10). Recovery starts from the most recent valid snapshot at or below the durable tip and replays forward only the stored blocks after it."
counterexample = "A node that loses power mid-admission recovers to a ledger fingerprint different from a clean run over its committed blocks, or a forged block admitted before the crash is replayed with different bytes after it."
family = "REC"
secondary_families = ["DET", "DUR"]
scope = "node recovery, write-ahead-log replay"
assumptions = ["A1", "A6"]
depends_on = ["DET-001", "REC-002"]
