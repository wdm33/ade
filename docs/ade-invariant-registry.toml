[[rules]]
id = "SEC-031"
name = "NativeSnapshotPointCoherence"
invariant = "Before anything is assembled or persisted, the native route checks that the snapshot is one Conway chain point: the certified point equals the tip the snapshot's own ledger state records (slot and header hash), the ledger state's current era is Conway, and its epoch equals the epoch the era schedule assigns to the certified slot. The ledger state carries no network identity of its own, so the network is the manifest's magic, which must match the selected network's committed profile and genesis hash; its authenticity rests on SEC-034. The Shelley genesis file whose constants the native route uses must hash to the selected profile's committed genesis hash before anything is assembled. The era schedule is built from the genesis epoch length and the network's committed Shelley start boundary, an unknown network being terminal, and the active-slot coefficient is parsed to an exact rational with no floating point. Any disagreement is a typed terminal error with nothing persisted."
counterexample = "The manifest file is edited to name a different slot; the node decodes the ledger state and anchors it at the manifest's slot without comparing it with the tip the state records."
