[[rules]]
id = "LIV-009"
name = "ReconnectTransportOnly"
invariant = "One total policy classifies every pump outcome: a transport loss (end of stream, read or write failure) on an established session reconnects it, re-dialling on a fixed, monotone, capped backoff schedule with no randomness or clock-derived jitter; a protocol or grammar violation, a deferred-frame overflow or a keep-alive violation ends that peer without retry; and a consumer that has gone away ends the pump. A peer that cannot be parsed, or whose first dial fails, is dropped without retry. Reconnecting re-establishes only the wire session and never turns a fail-closed authority outcome (admission, the rollback depth bound, boundary promotion, the forge fence) into a retry."
counterexample = "A peer that sends a malformed block is reconnected every second forever, or an unreachable peer at startup is re-dialled in a tight loop."
family = "LIV"
secondary_families = []
