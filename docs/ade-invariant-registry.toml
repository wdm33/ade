[[rules]]
id = "OBS-007"
name = "AdmissionEvidenceBoundAndReplayable"
invariant = "Every successful admission emits exactly one agreement-verdict event, never two for one block hash; the admission start, bootstrap-complete, block-admitted and verdict events each carry the consensus-input fingerprint (VAL-034), added as a field so the event vocabulary stays closed; and replaying an admission from the prior checkpoint and log yields the same post-admission ledger fingerprint and the same verdict."
counterexample = "A retried log write emits a second verdict for the same block, or the transcript's verdicts carry no fingerprint, so they cannot be tied to the consensus inputs they were judged under."
family = "OBS"
secondary_families = ["DET"]
scope = "admission and convergence evidence"
assumptions = ["A1"]
depends_on = ["OBS-006", "VAL-034", "REC-004"]
