[[rules]]
id = "VAL-014"
name = "ProtocolParametersEraFaithful"
invariant = "Imported protocol parameters keep the meaning their era gives them and are never remapped: Conway's coins-per-UTxO-byte is held as a per-byte coefficient, in a representation distinct from an absolute minimum, and the Conway minimum-UTxO check requires each output's coin to be at least the coefficient times (160 plus the byte length of the output's CBOR serialization as it appears in the transaction), as the reference node computes it."
counterexample = "Conway's coinsPerUTxOByte of 4310 imported as an absolute 4310-lovelace minimum, so an output far below the real minimum is accepted."
family = "VAL"
secondary_families = []
scope = "protocol parameters, snapshot import, Conway minimum-UTxO validation"
assumptions = ["A2"]
depends_on = ["VAL-001"]
