[[rules]]
id = "VAL-039"
name = "ClosedGenesisParser"
invariant = "The Shelley genesis file is read by one closed parser that requires the network magic, system start, slot length, slots per KES period and maximum KES evolutions with exact types, never assumes a default or network, ignores unknown keys only when they change nothing, converts the system start deterministically with no time library, and produces the same genesis anchor from the same file bytes and supplied KES anchor slot every time."
counterexample = "A genesis file missing its network magic is parsed as preprod, or a numeric field given as the string \"1\" is accepted."
