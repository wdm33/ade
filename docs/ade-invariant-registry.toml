name = "ReplayByteIdentity"
invariant = "Replaying the same canonical starting state with the same ordered canonical inputs, protocol version and recorded context produces byte-identical authoritative outputs, including the ledger-state fingerprint, persisted state encodings, the consensus event stream, declared effects and every validity verdict."
counterexample = "Two replays of one block stream from one snapshot end with ledger-state fingerprints that differ, or with verdict streams or persisted state encodings that differ in any byte."
family = "DET"
secondary_families = ["REC"]
scope = "authoritative core (ledger, consensus, block and transaction validity, persisted state)"
