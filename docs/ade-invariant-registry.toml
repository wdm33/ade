[[rules]]
id = "SEC-028"
name = "MultiPeerFairMerge"
invariant = "When several peers feed the receive path, no connected peer is starved by another: each peer's pump fills its own bounded lane, the lanes are merged round-robin (one item per peer per round) in the configured peer order, never by hash iteration, randomness, clock or scheduler timing, backpressure is per peer, and a disconnected peer's lane is retired without reordering the others. The merge decides only delivery opportunity: peer identity is preserved and chain selection stays independent of arrival order."
counterexample = "All pumps feed one shared bounded channel, a continuously producing peer fills it, and a competing honest peer's branch never reaches fork choice."
family = "SEC"
