name = "ShellCanonicalizesInputs"
invariant = "Transport artifacts (socket fragmentation, mux segment boundaries, interleaving across mini-protocols, read timing and timeouts) never reach the core: two transport histories that deliver the same ordered sequence of whole messages to each mini-protocol, from the same starting state, under the same protocol version, with the same recorded context and the same authoritative input order, produce identical core outcomes. Nondeterministic facts the core legitimately needs, such as the current slot, enter only as recorded explicit context."
counterexample = "A chain-sync validity decision that differs depending on how a header was split across mux segments, or a core function that reads a timeout flag the shell set."
family = "STR"
secondary_families = ["DET"]
