[[rules]]
id = "STR-020"
name = "AdmissionModeSingleEntry"
invariant = "Admission mode is entered through one runner, which composes the seed import, the bootstrap anchor, the bootstrap authority's warm start, the dialer, the per-block admission loop, the log append, the verdict reducer and the evidence log; the imported seed reaches the ledger only through one bridge that persists it as a snapshot at the seed point for the bootstrap authority's warm-start branch, never around that authority."
counterexample = "An admission test path builds its initial ledger state directly from the imported seed and skips the warm-start branch's checks."
