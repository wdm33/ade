[[rules]]
id = "OBS-006"
name = "AgreementVerdictEvidenceOnly"
invariant = "The agreement verdict is a closed four-variant value (agreed, lagging, diverged, input not found) computed by a pure reducer from the admission outcome and the peer's announced tip; it compares outcomes already decided and never decides validity, chain selection or canonical state. Lagging means only that no same-slot comparison was possible: the peer's announced tip is at a different slot from the admitted block, ahead or behind, with both slots in the payload so the direction is readable, or the peer announced Origin; it asserts no ancestry and no agreement, and no caller treats it as success, health, readiness or agreement."
counterexample = "The readiness check counts a lagging verdict as live-ready, so an operator pass is reported green while Ade is behind."
family = "OBS"
secondary_families = []
scope = "agreement verdict reducer and its callers"
assumptions = []
depends_on = ["OBS-005"]
locality = "local"
criticality = "critical"
