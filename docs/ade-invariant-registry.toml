[[rules]]
id = "DET-019"
name = "SingleSlotAuthority"
invariant = "The current slot is derived by one authority: the shell observes wall-clock time, and one conversion projects it over the network's complete timing calendar from system start, the calendar selected by the durable record's genesis hash and never by operator flags (operator-supplied network or genesis values are only fail-closed cross-checks). The authority is established only if the calendar is self-consistent (each segment boundary aligned to the previous segment's epoch length), reproduces the store's recorded epoch start and epoch length, places the seed point's slot inside the recorded seed epoch, and yields an anchor whose lineage verifies against the calendar; it is reconstructed from the bootstrap anchor slot, never persisted, and a forging start without the durable seed record fails closed; a schedule that does not cover system start is refused for both conversions, time to slot and slot to time. Only the slot crosses into the orchestrator core, which reads no clock, so replaying the core with a recorded clock and event stream gives byte-identical final state."
counterexample = "The forge converts time to a slot with a single anchor that ignores an earlier era's 20-second slots, so on preprod it computes a slot thousands of slots away from the real one."
family = "DET"
secondary_families = ["STR"]
scope = "slot clock, orchestrator core"
assumptions = ["A1", "A2"]
depends_on = ["STR-002", "DUR-005"]
locality = "local"
criticality = "critical"
