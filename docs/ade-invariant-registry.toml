[[rules]]
id = "SEC-010"
name = "ScriptWitnessClosureSingleAuthority"
invariant = "Whether a Conway transaction's script witnesses are sufficient and not extraneous is decided by one authority, which both the block path and the standalone transaction path call: with every spending and reference input resolved it gives the reference node's verdict; without full UTxO context it rejects exactly when a supplied native script fails evaluation and otherwise returns undetermined, never valid."
counterexample = "The standalone path accepts a transaction with an extraneous script witness that the block path rejects, or reduced mode reports valid for a transaction whose required script was never checked."
family = "SEC"
secondary_families = ["VAL"]
scope = "script witness closure (block path, standalone, reduced mode)"
assumptions = ["A2"]
depends_on = ["VAL-009", "VAL-017"]
