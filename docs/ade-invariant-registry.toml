[[rules]]
id = "VAL-043"
name = "TxSubmissionWireForm"
invariant = "The tx-submission codec accepts and preserves the reference node's wire form: each transaction id is the era-tagged pair [era index, 32-byte hash], never stripped or guessed, so a requester echoes the exact advertised id; id and transaction sequences are accepted as definite or indefinite-length arrays, a received message re-encodes to exactly its received bytes in whichever form it arrived, and messages Ade originates use the indefinite form the reference node sends."
counterexample = "Ade strips the era tag from an advertised transaction id and requests it back as a bare hash, which the reference node does not recognize."
family = "VAL"
secondary_families = []
scope = "TxSubmission2 codec"
assumptions = ["A2"]
depends_on = ["VAL-001", "DET-003"]
locality = "local"
criticality = "critical"
enforcement_compile_time = []
