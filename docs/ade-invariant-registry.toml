# Invariant registry — Ade
#
# The canonical, append-only list of defined invariants (Doctrine §4).
# An entry is appended only when the human approves its line in a Define batch
# (Doctrine §32); its ID is assigned at that moment (Doctrine §7).
#
# What agents may append, and how: ~/.claude/methodology/idse.md §3 step 4.
# Every other field changes only by redefinition
# (Doctrine §5): agent draft, consensus, human approval, recorded in
# `redefinitions` with the text it replaced (idse.md §1.4).
# Assumptions are recorded once, below, and entries cite them by ID.
#
# Families, ID and name patterns: Doctrine §6–§7.
# Checked by: python3 -I ~/.claude/methodology/tools/idse-id-lint.py
#
# Legacy IDD entries are frozen in docs/legacy/idd-invariant-registry.toml.
# Each entry migrated from one carries `legacy_ids`; every legacy ID's
# disposition is in docs/legacy/idd-to-idse-map.toml.

schema_version = 3
project = "ADE"
registry_count = 34

[[assumptions]]
id = "A1"
name = "ordered-recorded-inputs"
text = "for each authoritative state machine (ledger, chain selection, and each mini-protocol's state), the shell delivers inputs one at a time in one total order, and records the starting state, that order and each input's explicit context, so the history can be replayed completely."
approval = { by = "wdm33", date = "2026-11-08", record = "docs/planning/foundations.define.consensus.md#batch-1" }
redefinitions = []
status = "active"

[[assumptions]]
id = "A2"
name = "reference-node-semantics"
text = "the Haskell cardano-node defines the reference semantics for every observable protocol behaviour Ade claims to match; each comparison names the exact reference build it uses (the live venue runs 11.0.1; the pinned ledger-state hash corpus was extracted from 10.6.2). Ade executes only Conway semantics: it enters at a certified non-Origin Conway tip and never replays or executes historical eras, keeping historical era facts only as identifiers and slot-time geometry."
approval = { by = "wdm33", date = "2026-11-08", record = "docs/planning/foundations.define.consensus.md#batch-1" }
redefinitions = []
status = "active"

[[assumptions]]
id = "A3"
name = "nonzero-derived-kes-seeds"
text = "a KES sub-seed derived by the Sum6 seed expansion is never all zero (probability 2^-256), so a zeroed sub-seed in a stored key marks a period that has been evolved away."
approval = { by = "wdm33", date = "2026-11-08", record = "docs/planning/codec-wire-crypto.define.consensus.md#batch-1" }
redefinitions = []
status = "active"

