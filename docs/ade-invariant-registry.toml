[[rules]]
id = "LIV-004"
name = "BoundedCleanShutdown"
invariant = "On a shutdown request, while storage keeps completing writes, the node drains its admission, write and snapshot pipeline to a quiescent point within a fixed, stated deadline, without waiting for peer sessions, finishes writing every snapshot the cadence policy has scheduled up to that point, and exits successfully; restarting on the same stores yields a byte-identical initial state, the blocks after the last snapshot being replayed from the log. If the deadline passes or storage fails, the node exits with a distinct non-zero code without writing a partial snapshot, its durable state being that of the last commit."
counterexample = "The node ignores SIGTERM and must be killed, or a clean shutdown waits forever for a peer session to close."
family = "LIV"
secondary_families = ["REC"]
scope = "node shutdown"
assumptions = ["A1", "A6"]
depends_on = ["REC-004"]
locality = "local"
criticality = "critical"
