[[rules]]
id = "SEC-016"
name = "AgencyEnforced"
invariant = "Every mini-protocol enforces agency strictly: a message from the side that does not hold agency in the current state is rejected deterministically and ends the session. Beyond that runtime check, the node's own code cannot construct a message for a role or agency it does not hold: the serving side's public API can build only server-agency messages, and the receive reducer's public API offers no way to construct or admit a locally originated or client-output event."
counterexample = "A peer sends MsgRollForward while the client holds agency and the node accepts it, or the server-side code emits a client request on a session it serves."
