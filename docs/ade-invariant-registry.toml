[[rules]]
id = "SAF-004"
name = "AtMostOneActivationPerEpoch"
invariant = "Within one canonical chain history, at most one epoch view activates for each target epoch, and its durable activation record holds the view's complete identity: target epoch, network, era, transition point, source checkpoint commitment, snapshot phase, nonce commitment and the view's canonical hashes. A second record for the same target epoch on the same history is an idempotent replay if it is byte-identical to the first and a terminal conflict otherwise. A rollback that abandons an activation's transition point invalidates that activation record with the rollback, before any replacement activation for the epoch, and the record is never reused (#16)."
counterexample = "After a restart the node activates a second, different view for an epoch whose view was already activated, or the activation record holds only a hash and a point, so a different view with a colliding point would be accepted on recovery."
family = "SAF"
secondary_families = ["FIN"]
scope = "epoch-view activation"
