[[rules]]
id = "LIV-001"
name = "BoundedRefold"
invariant = "When a settled rewind point exists and every proof about it holds (canonical at its slot, at least k blocks below the tip, at or before the rollback target, fingerprint verified), re-deriving the epoch accumulator after a rollback replays at most 2k blocks, independent of how long the node has run: once the chain has advanced 2k blocks past bootstrap, the settled point is between k and 2k blocks below the tip, and it survives the recovery pass that follows a durable rollback, being re-proved against the chain as it stands after the rollback commits rather than discarded. Before a settled point exists, or when a proof fails, the refold starts from the certified bootstrap baseline (REC-001, DUR-002)."
counterexample = "Every rollback rewinds to the bootstrap anchor, so after weeks of uptime a one-block reorg costs a ten-hour refold and the node misses its leadership slots; or the recovery pass after a rollback deletes a valid settled point and refolds from bootstrap."
family = "LIV"
secondary_families = ["REC"]
scope = "epoch accumulator rewind and recovery"
assumptions = ["A1", "A2", "A4"]
depends_on = ["REC-001", "DUR-002"]
locality = "local"
criticality = "critical"
enforcement_compile_time = []
enforcement_runtime = ["crates/ade_runtime/src/chaindb/epoch_accumulator_store.rs — roll_settled_rewind_point stage/promote cycle; carried from legacy DC-EPOCH-30", "ci/ci_check_accumulator_refold_bound.sh — carried from legacy DC-EPOCH-30", "crates/ade_node/src/node_lifecycle.rs — accumulator_recertify_settled_after_rollback, called in resolve_and_apply_peer_rollback strictly AFTER apply_chain_event; carried from legacy DC-EPOCH-35", "crates/ade_runtime/src/chaindb/epoch_accumulator_store.rs — recertify_settled_anchor; carried from legacy DC-EPOCH-35", "ci/ci_check_settled_rewind_survives_recovery.sh — carried from legacy DC-EPOCH-35"]
enforcement_superseded = []
tests = ["settled_point_never_falls_further_than_2k_behind_the_tip", "settled_point_is_only_promoted_once_k_blocks_settled", "a_recertified_settled_point_makes_the_next_pass_forward_fold", "recertification_refuses_a_settled_point_the_new_chain_abandoned", "recertification_refuses_a_settled_point_not_k_settled_against_the_new_tip", "recertify_settled_anchor_writes_the_anchor_at_the_settled_point", "recertify_refuses_a_triple_whose_fingerprint_does_not_verify", "recertify_refuses_when_the_cursor_is_not_at_the_settled_point", "recertify_refuses_when_no_settled_triple_exists"]
ci_scripts = ["ci/ci_check_accumulator_refold_bound.sh", "ci/ci_check_settled_rewind_survives_recovery.sh"]
approval = { by = "wdm33", date = "2026-11-08", record = "docs/planning/epoch.define.consensus.md#batch-1" }
redefinitions = [{ date = "2026-11-09", by = "wdm33", nature = "reinterpret", record = "docs/planning/resources-release.define.consensus.md#batch-1", evidence_before = 0, previous = { invariant = "When a settled rewind point exists and every proof about it holds (canonical at its slot, at least k blocks below the tip, at or before the rollback target, fingerprint verified), re-deriving the epoch accumulator after a rollback replays at most 2k blocks, independent of how long the node has run: once the chain has advanced 2k blocks past bootstrap, the settled point is between k and 2k blocks below the tip, and it survives the recovery pass that follows a durable rollback, being re-proved against the chain as it stands after the rollback commits rather than discarded. Before a settled point exists, or when a proof fails, the refold starts from the certified bootstrap baseline (#15, #19)." } }]
