invariant = "In every mode, the forge base (ledger state, chain-dependent state, stake distribution view, epoch nonce and tip) is initialized from the state the one bootstrap authority produced and is updated by every later admission, admissions before the first forge included, so each forge builds on the latest admission's state (VAL-051); the protocol version and parameters a forge uses come from that base's ledger state. No forge path builds a synthetic base: no zero-stake or empty ledger, no default protocol parameters or version, no constant previous hash and no second recovered state."
