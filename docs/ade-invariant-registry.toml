[[rules]]
id = "REC-005"
name = "RecoveryFindsCommonAncestor"
invariant = "After any process termination, a node recovering from valid durable state finds a common ancestor with a compatible peer, given that peer's responses to its intersection requests, whenever one exists within its supported intersection history (k blocks below its durable tip, or its oldest stored block if fewer are kept), without discarding authoritative state silently and without changing replay: the ledger state, chain-dependent state and selected chain after rolling back to that ancestor and replaying forward equal those of a run that never adopted the abandoned blocks, compared at the same canonical chain points, the write-ahead log's audit history of the abandoned admissions and the rollback being excluded from the comparison. When no such ancestor exists, it stops following that peer with a structured outcome and leaves its durable state untouched; a peer's reply never instructs it to rewrite the chain back to genesis."
counterexample = "A restarted node offers the peer only its tip, gets no intersection, and resets its chain to genesis."
family = "REC"
secondary_families = ["LIV"]
scope = "recovery, chain-sync intersection"
assumptions = ["A1", "A4"]
depends_on = ["REC-004", "SAF-007"]
locality = "distributed"
criticality = "critical"
enforcement_compile_time = []
enforcement_runtime = []
enforcement_superseded = []
tests = []
