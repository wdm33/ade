name = "KeepAliveClientWireOnly"
invariant = "The wire pump runs the node-to-node keep-alive client through the shared keep-alive state machine and codec: it sends a keep-alive on a fixed cadence shorter than the peer's keep-alive timeout, never while one is outstanding, with a cookie from a deterministic wrapping 16-bit counter, and accepts a response only if its cookie matches; a grammar or cookie violation ends that peer's session with a typed error. Keep-alive traffic produces no pump event, no event in any evidence vocabulary and no canonical input (shell diagnostics, excluded from evidence and replay, may record it), is never dispatched as chain-sync or block-fetch traffic, and does not delay or reorder them."
