[[rules]]
id = "VAL-011"
name = "CertificateTransitionsClosed"
invariant = "Every Conway certificate decodes through the Conway certificate grammar with all its payload fields and resolves to one closed disposition: either a structured rejection, or the complete list of its effects, each applied exactly once by the owner of the state it changes, delegation and pool state or governance state (vote delegation, committee hot keys, DRep expiry). A composite certificate has each half applied once by its own owner; no effect is dropped, flattened or applied twice, and DRep expiry is computed only from explicit governance context."
counterexample = "A combined stake-and-vote delegation certificate whose stake half is applied by both the delegation owner and the governance owner, or a committee hot-key certificate that is decoded and then ignored."
family = "VAL"
secondary_families = []
scope = "ledger certificate state and Conway governance state"
assumptions = ["A2"]
depends_on = ["VAL-001", "SAF-001"]
locality = "local"
criticality = "critical"
enforcement_compile_time = []
enforcement_runtime = []
enforcement_superseded = []
