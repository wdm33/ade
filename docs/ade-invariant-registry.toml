invariant = "After adopting a winning branch at tip X, the node admits the winning peer's descendants in parent-link order (X+1, then X+2), never admitting a descendant whose parent it has not validated. When a bridge block is missing, it re-fetches the missing range from the winning peer only, with a deterministic bounded number of retries, and admits it in order only when the fetched range is complete, parent-linked and body-validated; otherwise it holds with a structured missing-bridge reason and its durable chain unchanged. While a missing bridge is held, forging stays refused; only a real linear admission or a proven fork-switch adoption clears the hold. It never stalls silently."
