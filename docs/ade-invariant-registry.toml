[[rules]]
id = "VAL-022"
name = "PraosNonceEvolution"
invariant = "Each validated header drives one indivisible nonce transition as the reference Praos protocol defines it: the evolving nonce becomes the evolving nonce combined with the header's VRF nonce output; the candidate nonce becomes the new evolving nonce while the header's slot is below firstSlotNextEpoch minus ceil(4k/f), and otherwise stays frozen; the last-block nonce becomes the hash of the header's previous block. At each epoch tick the epoch nonce becomes the candidate nonce combined with the last-epoch-block nonce, the previous epoch nonce becomes the old epoch nonce, the last-epoch-block nonce becomes the last-block nonce, and the evolving and candidate nonces carry over unchanged. Combining is blake2b-256 of the concatenation, with the neutral nonce as identity and no extra-entropy operand; an absent last-epoch-block nonce fails closed unless a valid bootstrap bridge supplies it, and no nonce is ever fabricated. The first epoch nonce after bootstrap comes from that same tick over the live chain state; a seed-time nonce stored at bootstrap must equal it when the seed sat at or after the freeze slot and is not used otherwise, and a seed position that cannot be located relative to the freeze, or a network whose stability window is unknown, is terminal."
counterexample = "The candidate nonce keeps evolving after the stability-window slot, or the epoch nonce after bootstrap is copied from a value projected at snapshot time while the candidate was still moving, so the node's leader checks use a nonce the network does not."
family = "VAL"
secondary_families = ["DET"]
scope = "Praos chain-dependent nonce state"
assumptions = ["A2"]
depends_on = ["SEC-004"]
