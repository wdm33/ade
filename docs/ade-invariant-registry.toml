name = "NetworkConstantsFromSchedule"
invariant = "No network-specific constant enters an authoritative computation except through the network's declared era schedule and genesis data; every epoch number on an authoritative path is derived from the caller's era schedule, and any mainnet-only constant is reachable only through an explicitly named mainnet schedule."
counterexample = "A slot-to-epoch conversion that applies mainnet's Shelley start slot and epoch length to a preprod slot, producing a fictitious epoch number."
