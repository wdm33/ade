name = "ClosedIsolatedEventVocabularies"
invariant = "Each mode's evidence log has its own closed event vocabulary (wire-only, admission, producer, and the three-event convergence subset), written through its own sink, and no mode emits another mode's events; events carry no free-form reason strings and no host-dependent content such as file paths, and peers appear in replayable events only as opaque counters, socket addresses being shell metadata outside replay comparison. Keeping key material out of every log is SEC-025."
