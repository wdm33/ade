[[rules]]
id = "SEC-009"
name = "BoundedStackDepth"
invariant = "No code path that decodes, skips, evaluates, clones, compares or drops a wire-supplied native script, or skips any wire-supplied CBOR item, uses call-stack depth that grows with the input's nesting depth; pending work is kept on the heap, and no nesting limit below what transaction and block size allow is imposed."
counterexample = "A recursive native-script decoder that overflows the stack on a transaction nesting 100,000 all-of scripts, crashing the node; or a depth limit of 64 that rejects a valid block."
