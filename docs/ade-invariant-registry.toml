name = "SigningInShellVerificationInCore"
invariant = "Private key material (KES, VRF and cold keys) is loaded, stored and owned only by RED shell code, and every signing, proving or key-evolution call is made from RED code; no BLUE transition takes a private key as input or produces a signature or VRF proof. Pure signing, proving and key-evolution algorithms may live in BLUE crates as library functions, provided only RED code calls them. Every signature, VRF and KES verification that decides whether a block, header or transaction is accepted is computed in BLUE code, and no RED code passes a verification verdict into a BLUE transition."
counterexample = "A BLUE block-construction function that takes a KES signing key and signs the header, or a RED function that checks a header's KES signature and hands the BLUE header validator a boolean it trusts."
