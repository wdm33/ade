[[rules]]
id = "VAL-057"
name = "ForgedBlockSingleEncoding"
invariant = "A forged block is emitted as the era-tagged [era, block] envelope by the one block encoder that is the inverse of the block decoder header validation uses, and its header's body hash is computed by the validator's body-hash recipe over the very body bytes it emits; the forge rejects, with a typed error and before emitting any bytes, a tick whose block number and previous hash form an illegal header position (VAL-003); and decoding a forged block yields exactly the header fields and four body segments that were forged, so no forge output exists that the block decoder rejects."
counterexample = "The forge emits a bare five-element block without the era tag, so its own decoder rejects every forged block at offset 0; or the forge hashes a re-encoded body while the emitted body uses different bytes."
family = "VAL"
secondary_families = ["DET"]
