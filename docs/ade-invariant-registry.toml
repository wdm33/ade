[[rules]]
id = "VAL-009"
name = "CompleteValidation"
invariant = "A block is valid only if both the consensus header authority and the ledger body authority accept it. A transaction in a block is accepted only if phase 1 accepts it (native scripts included) and the outcome of evaluating its Plutus scripts agrees with the phase-2 status the block declares for it: evaluation succeeds for a transaction marked valid and fails for one in the block's invalid-transactions set, which then takes the collateral path. A standalone transaction is admitted only if phase 1 accepts it and its Plutus scripts evaluate successfully. No path produces a valid verdict while skipping any of these checks."
counterexample = "A block-validation path used during recovery that applies the body without running header validation and reports the block valid; or a block that marks a transaction phase-2-invalid although its scripts succeed, which is accepted."
family = "VAL"
secondary_families = []
scope = "block and transaction validation"
assumptions = ["A2"]
depends_on = []
locality = "local"
criticality = "critical"
