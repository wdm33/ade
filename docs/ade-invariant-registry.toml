[[rules]]
id = "VAL-016"
name = "SinglePhaseTwoEffect"
invariant = "A transaction's UTxO and accounting effect is derived in exactly one place, from the block and its invalid-transactions set: a phase-2-valid transaction spends its ordinary inputs and produces its ordinary outputs at indices 0 to n-1; a phase-2-invalid transaction spends only its collateral inputs, produces only its collateral return at index n, where n is its number of ordinary outputs, adds its consumed collateral to the fee pot, and has no other effect, its certificates, withdrawals, votes and proposals being discarded. Consumers receive only the derived spends, outputs and fee contribution, never the phase-2 status, so they cannot branch on it."
counterexample = "A phase-2-invalid transaction whose ordinary inputs are removed from the UTxO, or whose stake registration certificate is applied."
family = "VAL"
secondary_families = ["CON"]
scope = "UTxO application and accumulators"
assumptions = ["A2"]
depends_on = ["CON-001", "CON-003"]
locality = "transactional"
