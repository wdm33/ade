[[rules]]
id = "STR-005"
name = "CredentialDiscriminantPreserved"
invariant = "A stake, committee or DRep credential is a closed sum of a key hash or a script hash over 28 bytes everywhere: in decoding, as a ledger-state key and in comparison; a key-hash credential and a script-hash credential with the same 28 bytes are distinct, no conversion from a bare 28-byte hash to a credential exists on the authoritative path, and every authoritative encoding and fingerprint of a credential includes its key-or-script tag."
counterexample = "A script-hash stake credential and a key-hash stake credential with the same 28 bytes share one reward account in Ade's ledger state."
family = "STR"
secondary_families = ["VAL"]
scope = "ledger credentials, certificate and governance state"
assumptions = ["A2"]
depends_on = ["VAL-001"]
locality = "local"
criticality = "critical"
