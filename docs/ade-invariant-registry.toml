[[rules]]
id = "SEC-017"
name = "PerPeerOutboundIsolation"
invariant = "Outbound messages reach a peer only as typed commands through that peer's own outbound channel and the one session-aware encoder; no raw byte tunnel exists, no code can create a channel for a peer that did not connect, a peer's channel is removed when it disconnects, the channel map iterates in a deterministic order, looking up a missing peer is a structured error, bytes meant for one peer never reach another, and commands for a peer arrive in the order they were sent."
counterexample = "A served block meant for peer A is written to peer B's socket because the outbound map is looked up by a stale index, or two commands for one peer arrive in reverse order."
family = "SEC"
secondary_families = ["ORD"]
scope = "outbound dispatch"
assumptions = []
depends_on = ["DET-017"]
locality = "local"
