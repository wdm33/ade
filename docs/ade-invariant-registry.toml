[[rules]]
id = "VAL-006"
name = "SigningMatchesReference"
invariant = "Ade's Sum6 KES and Praos VRF signing produce output byte-identical to the Haskell cardano-base reference for every input: verification-key derivation, key generation from a seed, evolution across all 64 periods, KES signatures and VRF proofs; every KES signature and VRF proof Ade emits verifies under Ade's own verifier (SEC-003) with the matching verification key; the 608-byte expanded KES signing key serializes and deserializes byte-identically to the reference for every period from 0 to 63, with the current period inferred uniquely from the key's tree shape. The algorithm is Ade's own code: no production path builds a key of an upstream library through unsafe layout assumptions, transmute, vendored private access or fork-only constructors."
counterexample = "A seed expansion that uses different prefix bytes from cardano-base, so the derived verification key differs from the one cardano-cli derives from the same key file."
family = "VAL"
secondary_families = ["DET"]
scope = "ade_crypto Sum6 KES and VRF, RED producer signing"
