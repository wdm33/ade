name = "OutputQuantityFullDomain"
invariant = "Every output asset quantity holds Cardano's full unsigned 64-bit domain, a negative output quantity cannot be represented, and output-value arithmetic is checked: overflow and underflow are structured errors, never a wrap or a saturation."
counterexample = "An output carrying 2^63 units of a token is rejected because the quantity is stored as a signed 64-bit integer, or adding two outputs' quantities wraps to a small number."
