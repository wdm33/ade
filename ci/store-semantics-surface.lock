[[entry]]
store_semantics_version = 2
surface_hash = "cbc4f29e808f8c9b18e8b0afb2a260b376b4678954053b077e85bc86065cba1d"
semantics_neutral = false
rationale = "PREPROD-NONCE-2 CE-N2-4 -- a REAL semantics change, plus a surface widening that this change itself demonstrated was needed. WHAT CHANGED: the seed+1 bootstrap-bridge boundary now commits the BOUNDARY-TICK eta0 into its durable activation record instead of the bridge's seed-time projection (epoch_wire::bind_bridge_view takes the final eta0 as a required argument and no longer reads the stored field). For a seed that PRECEDED the candidate freeze the two values differ -- preprod 304->305 wrote nonce_commitment = e3402a2b.. where cardano-node's epochNonce(305) is 74f10bea.. -- so a store written by an earlier binary is NOT replay-equivalent under this one: warm-start would re-derive the tick and fail EpochViewPostPromotionMismatch, the exact opaque terminal this version exists to convert into a typed re-bootstrap. Hence a BUMP to 2, not a neutral declaration. Note the direction of the risk: the immediately-previous binary (81df0bac) refused to bootstrap pre-freeze at all, so ITS stores are all post-freeze and would agree; the stores this invalidates are the pre-81df0bac ones, including the preserved preprod reproducer. Choosing neutral on that reasoning would be the P4 mistake in miniature -- relying on which generation happens to be on disk instead of on the marker. SURFACE WIDENING: crates/ade_node/src/epoch_wire.rs is added because it DECIDES the nonce every durable activation record commits (epoch_activation::activation_record_for is a pure projection of the view epoch_wire binds, making no value decisions of its own). This is the same gap 81df0bac closed for bootstrap_bridge.rs, but demonstrated rather than hypothesized: CE-N2-4 altered durable authority and this gate fired ONLY because of an unrelated field rename in bootstrap_bridge.rs. Also included in the hash: bootstrap_bridge.rs field rename epoch_nonce -> seed_time_eta0 (wire-neutral -- positional CBOR, so encoding, canonical_commitment and every existing durable byte are unchanged; the rename exists so the field cannot be read as authority)."

[[entry]]
store_semantics_version = 3
surface_hash = "4796d7a391c730616994a6d2417635246a45775d9de5c8b96076d7f3d1835dde"
semantics_neutral = false
rationale = "CRE-S7 -- an unambiguous production-rule change, and exactly the case this mechanism exists for. governance.rs widens the Conway ParameterChange enactment subset to include key 16 (minPoolCost) alongside the memory-only exec-units keys 20/21. Before: a ratified action touching key 16 landed in unsupported_fields and the whole boundary refused (UnsupportedRatifiedAction), enacting nothing. After: it enacts, so pparams.min_pool_cost CHANGES -- and min_pool_cost is written into the protocol-params fingerprint (fingerprint.rs:497) and the durable snapshot (snapshot/gov_state.rs). Replaying identical blocks under this binary therefore yields different durable authority bytes than under the previous one, which is the definition of not replay-equivalent. Hence BUMP 2 -> 3. PROVEN against the reference rather than asserted: cardano-cli conway query gov-state on preprod puts e641ec80..#0 at prevGovActionIds.PParamUpdate, and diffing previousPParams vs currentPParams shows exactly the three fields it enacted -- minPoolCost 170,000,000 -> 75,000,000, maxTxExUnits mem 16.5M -> 17.5M and maxBlockExUnits mem 72M -> 77.5M with both steps preserved. The two exec-units changes were already in the supported subset, so Ade was ONE parameter short of enacting preprod's real update; that one parameter is what stalled the 304->305 accumulator cross. Note the deliberate consequence: this INVALIDATES the CRE-S7 reproducer store (~/.cardano-live1/ade-preprod-p2, stamped v2), which is correct -- a store whose boundary was crossed under the old enactment rules must not be reused to prove the new ones. The classification argument is recorded in full in the slice doc: minPoolCost is read by NO ledger rule, so it is inert in COMPUTATION, but it is LIVE in the FINGERPRINT, and declining to enact it would leave Ade permanently at 170,000,000 against the chain's 75,000,000 inside fingerprinted durable state -- the P4 failure shape. Also in this hash: the UnsupportedRatifiedAction terminal gains an unsupported_keys operand and CanonicalFieldSet renders keys by name, which are diagnostic-only and change no produced value."

[[entry]]
store_semantics_version = 3
surface_hash = "bff574e3ae00b355a2478261d6ed93cf76ea675497d76d64b4e79b33fe2185d7"
semantics_neutral = true
rationale = "LIVE-2 CE-L2-6: consensus_view.rs gains ONE additive read-only accessor, PoolDistrView::pool_count() -> usize, and nothing else. No durable field, encoding, canonical commitment or produced value changes; every existing item is byte-identical, so no store written by the previous binary becomes invalid and no replay output moves. It exists so the forge path can tell \"our pool is absent from a POPULATED leadership set\" (a legitimate not-elected answer) from \"the leadership set is EMPTY\" (authority never established, which can answer nothing) -- both of which make leader_schedule_answer return UnknownPool. The behaviour change that consumes it lives in crates/ade_node/src/produce_mode.rs, which is deliberately NOT on this surface: it decides what Ade FORGES, not what authoritative production writes into a durable store. Declared neutral on that basis."

