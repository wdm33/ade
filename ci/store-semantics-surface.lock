semantics_neutral = true
rationale = "LIVE-2c domain-start ruling: era_schedule.rs gains slot_start_time_ms (the canonical inverse of slot_at) and DerivedTimingAnchor::derive_for_bootstrap_anchor, plus tests. Additive and still UNWIRED -- every pre-existing item is byte-identical, no production path calls either yet, and no durable artifact gains a commitment, so nothing a store records can differ. Declared neutral. The purpose is determinism across restarts: the anchor domain is a function of a bootstrap FACT (the verified anchor slot) rather than of process start / wall clock / peer tip / operator input, so the same bootstrap anchor plus the same timing history reconstructs the same anchor whenever it is rebuilt. The reassessment trigger stands for the activation slice."

[[entry]]
store_semantics_version = 5
surface_hash = "e9e5fe3c691bfd93f18892cf3ad1dbd68f9fdfabb457f0ea5dd5bd9f6b9085cb"
semantics_neutral = false
rationale = "BND-2a + BND-2c, reconciled TOGETHER and recorded late -- see the process note at the end. (v4, BND-2a) The UTxO effect of a transaction is now gated by its phase-2 validity: a phase-2-INVALID tx removes only its COLLATERAL inputs and adds only its collateral return, its ordinary inputs survive and its ordinary outputs are never created (Cardano.Ledger.Babbage.Rules.Utxo, Phase2Invalid). Earlier binaries applied every tx's ordinary inputs/outputs regardless of validity and never consumed collateral, so replaying the SAME canonical blocks produces a DIFFERENT reduced UTxO and therefore a different stake view, which seals frozen leadership at every boundary. Live-proven: a v3 store is refused with StoreSemanticsVersionMismatch{found:Version(3),required:4,action:RebootstrapRequired}, exit 1. (v5, BND-2c) The accumulator now APPLIES the Phase2Invalid transition instead of refusing it: ordinary body effects (certs, withdrawals, votes, proposals) are DISCARDED -- including at the single cert walk in process_block_certificates, which previously applied every tx's certs and relied on the now-removed guard fail-closing first -- and the consumed collateral (collAdaBalance over the RESOLVED collateral inputs) is credited to the fee pot. NOT neutral on either count. CAVEAT recorded rather than hidden: the collateral-resolution half is NOT live-proven (DC-LEDGER-03 is registered `partial`) -- the live v5 run refused at preprod 130,350,133 with CollateralBalance(UnresolvedCollateralInput) because the reduced checkpoint sits at the durable TIP during the accumulator's walk rather than at the accumulator's cursor. The bump stands independently, because the cert/governance discard alone changes what the same blocks produce. PROCESS NOTE: the v3->v4 bump was made without running this gate, so no entry was recorded for it at the time; the omission was found by auditing the last 100 commits, and v4's own surface hash is no longer reconstructible. Rather than fabricate one, both bumps are reconciled in this single entry against the CURRENT surface. The gate did its job -- it refused to pass until the choice was stated -- and the lesson is that a STORE_SEMANTICS_VERSION edit must run ci_check_store_semantics_lock.sh in the same commit."

[[entry]]
store_semantics_version = 6
surface_hash = "275170827b5c465be8dfefce828473f5dc63cbd9d3723d56e5687569d93b59fb"
semantics_neutral = false
rationale = "BND-2d (INV-BND-2d), the positioning contract for a collateral valuation. The reduced UTxO authority now RETAINS the TxIn -> Coin binding of every collateral input it destroys under Cardano's Phase2Invalid rule, written in the SAME redb transaction that advances its cursor. WHY IT IS NOT NEUTRAL: a v5 checkpoint holds no retention for any block it has already applied, and the co-advancer drives the checkpoint to the durable tip at the end of every pass, so at accumulator-walk time the authority is routinely PAST the consuming block and the entry is legitimately gone. Under a v6 binary a v5 store would therefore refuse at every past phase-2-invalid block -- replaying the same canonical blocks does not reproduce the same accumulator state. Measured live on preprod 2026-08-16: checkpoint at ~130,550,441, accumulator at 130,350,114, collateral input 0326ab20...#1 already spent by block 130,350,133, CollateralBalance(UnresolvedCollateralInput), cursor pinned. SURFACE CHANGE IN THE SAME ENTRY: crates/ade_runtime/src/chaindb/reduced_utxo_checkpoint.rs is ADDED to the hashed surface. It defines the durable table set of a semantics-bearing store, the BND-2d retention lives entirely in it, and a later change to the retention's meaning that touched only that file would otherwise pass this gate in silence -- the v3->v4 omission lesson, generalized from 'remember to bump' to 'let the gate see the file'. VALIDITY-BLIND CORRECTION (found by ci_check_phase2_invalid_utxo_effect.sh during this slice, not by review): the retention naming was first written as an `if invalid` branch inside reduced_advance::process_one_tx, which broke INV-BND-2a's consumer rule -- consumers apply what the derivation names and never branch on the phase-2 flag, so the two readings cannot drift. The naming moved INTO the single derivation as TxUtxoEffect.collateral_consumed (empty for a phase-2-valid tx), so rules.rs is in this surface hash too. The gate was fixed, not weakened. WHAT DOES NOT CHANGE: reduced_block_delta's spent/produced are byte-identical (only an additive naming field), and compute_fingerprint still iterates the reduced table alone, so the checkpoint commitment sealed into frozen leadership is unchanged for the same chain prefix -- asserted by the_retention_does_not_move_the_checkpoint_commitment."

[[entry]]
store_semantics_version = 7
surface_hash = "48b617d0a4b24302c9c8f1f0b668a78ad7a2b2f3ddf13c26497b3b599a9a5739"
semantics_neutral = false
rationale = "LV-1 (DC-EPOCH-40), the leader-check sigma denominator. (Hash reconciled once within this same uncommitted slice, when the rule id was corrected from a wrongly-chosen DC-EPOCH-47 to the next free 40; comment-only, no semantic change, and recorded here rather than appended as a second v7 entry.) FrozenLeadershipPoolDistr gains total_active_stake -- cardano's pdTotalActiveStake -- and to_pool_distr_view READS it instead of summing the pool entries; StakeSnapshot::total_active_stake is the single definition, folded over the CREDENTIAL side (delegations), and both the boundary freeze and the bootstrap mark import call it. FROZEN_LEADERSHIP_SCHEMA_VERSION 6 -> 7 with it (the outer array grows 6 -> 7). WHY IT IS NOT NEUTRAL: the object is durable, canonically encoded and hash-committed, and a v6 object has NO total to read. Reconstructing one by summing its surviving entries is precisely the defect, so a v6 store is refused rather than reinterpreted. Replaying the same canonical blocks under a v7 binary yields a different sigma for every pool at any boundary where the leadership membership filter drops or admits stake, hence a different leader schedule. ORACLE, quoted at TWO points in cardano-ledger's history so the finding is not an artefact of one release: Conway (cardano-ledger-conway-1.17.0.0) computes `let total = sumAllStakeCompact stake` where `sumAllStakeCompact = VMap.foldl (<>) mempty . unStake`; master computes `ssTotalActiveStake = sumAllActiveStake ssActiveStake` in mkSnapShot and calculatePoolDistr' then merely copies it (`pdTotalActiveStake = activeStake`). In BOTH, the denominator is folded over the STAKE/credential map and the membership guards (includeHash, spssNumDelegators > 0) filter unPoolDistr ONLY, running AFTER the total is fixed -- so which pools appear cannot change it. Ade summed self.pools, the set surviving delegated_pools INTERSECT registered_pool_vrfs, making every pool's sigma a function of the membership filter. MEASURED on preprod: at epoch 306 a RETIRED pool (8ed5ab11...eea88, 63,075,223,742,053 = 3.879% of the summed total) sits in the leadership set and is absent at 307, inflating the denominator by 3.879%, deflating every sigma by 2.9%, and deterministically rejecting a real preprod header with LeaderValueAboveThreshold where only +0.0315% of sigma was needed. WRONG IN BOTH DIRECTIONS, and the other one is worse: stake cardano counts behind a pool Ade filtered out deflates the denominator, inflates every sigma and every threshold, and would make Ade ACCEPT a header cardano rejects -- a silent consensus divergence on the receive path. MEMBERSHIP IS UNCHANGED and is CORRECT per the same oracle (numDelegators > 0 intersected with registered VRFs, retaining pools retiring at the boundary); DC-EPOCH-24/25 are not re-opened, and the retired pool STAYS in the set. The fix is the denominator's derivation alone. NOT CLAIMED: the VALUE of ssTotalActiveStake at the 304->305 boundary is not confirmed against a reference (the epoch-306 nesPd no longer exists on disk), and the census's separate ~0.8% epoch-306 numerator gap is unexplained and NOT addressed here."
